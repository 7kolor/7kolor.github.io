name: publish
# 内容目录有变动时自动构建并发布：
#   校验 meta.json → 生成单语页 report-zh/en → 更新首页卡片/归档/feed → 自动提交
# 普通页面（index/about 等）改动不走此流程，直接由 GitHub Pages 发布。
on:
  push:
    branches: [main]
    paths:
      - 'weekly/**'
      - 'analysis/**'
      - 'insights/**'
      - 'cases/**'
      - 'scripts/**'
      - 'templates/**'
      - 'assets/**'
      - '**/meta.json'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 pinned by SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 pinned by SHA
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate & build
        run: python3 scripts/publish.py

      - name: Commit generated pages
        run: |
          git config user.name "7kolor-bot"
          git config user.email "actions@github.com"
          # 只 add 构建产物与已知目录，不用 git add -A：
          # 避免任何「未被 .gitignore 忽略」的未跟踪文件被自动推上 Pages
          # 逐个判断目录是否存在（analysis/insights/cases 等内容类型尚未启用时不存在）
          for d in weekly assets scripts templates steps docs worker; do
            [ -d "$d" ] && git add -A -- "$d"
          done
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-build content [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
